name: CI / CD

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.editorconfig'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.editorconfig'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc.json'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: timetracker_test
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timetracker -d timetracker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://timetracker:timetracker@localhost:5432/timetracker_test?schema=public
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: ci@time-tracker.local
      AUTH_SECRET: ci-test-secret-do-not-use-in-production
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      WS_PORT: 3001
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:trace
      - run: pnpm build

      # Playwright caches browsers per user (~/.cache/ms-playwright), not per
      # workspace package, and @tt/web and @tt/extension resolve the same
      # @playwright/test (one entry in pnpm-lock.yaml) — so this one install
      # serves both e2e suites. The extension re-runs `install` below to
      # self-heal if those versions ever drift apart.
      - name: Install Playwright browsers
        run: pnpm --filter @tt/web exec playwright install --with-deps chromium

      - name: Apply Prisma schema to CI Postgres
        run: pnpm --filter @tt/db exec prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      # multi-tab-timer.spec.ts (US-103) proves a stop in one tab reaches another
      # over the socket. Without a live ws service `useTimerSync` no-ops and the
      # page falls back to refetch-on-focus, so that spec would fail. `pnpm build`
      # above already produced apps/ws/dist.
      - name: Start the WS service for cross-tab e2e
        run: |
          pnpm --filter @tt/ws start &
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 2 "http://localhost:${WS_PORT}/" >/dev/null; then
              echo "ws up on :${WS_PORT}"
              exit 0
            fi
            sleep 1
          done
          echo "::error::ws service did not become ready on :${WS_PORT}"
          exit 1

      - run: pnpm test:e2e
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          WS_PUBLIC_URL: ws://localhost:${{ env.WS_PORT }}
          # The app runs in Europe/Prague. Pin the e2e runner + dev server to the
          # same zone so timezone-sensitive seed data (e.g. auto-stack overlap
          # windows seeded via new Date().setHours()) lands in the same hours the
          # app interprets form times in. Under the runner's default UTC the seed
          # and the candidate stop overlapping, so the overlap dialog never shows.
          TZ: Europe/Prague

      # US-92 and US-99 have their ONLY tests here. `pnpm test:trace` greps files
      # for a US id; it cannot know whether the file ever executes, so without
      # this step the coverage report vouches for two stories nothing runs.
      # No database: the suite stubs chrome.* and every /api/v1 route, and its
      # webServer serves the built bundle via `vite preview`.
      #
      # `--with-deps`, not a bare `install`: today this is a no-op (same
      # @playwright/test as @tt/web, browser already cached). The day the versions
      # drift it fetches a new browser revision, which without its system
      # libraries would fail to launch — a bare `install` cannot self-heal drift,
      # it only relocates the failure.
      - name: Install Playwright browsers for the extension suite
        run: pnpm --filter @tt/extension exec playwright install --with-deps chromium

      - run: pnpm test:e2e:ext

  deploy:
    name: Deploy to Coolify
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-coolify-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://tracker.agent42.cz

    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL || 'https://panelqwertzuiop.agent42.cz' }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID || 'cg8145vxiumj2l9lzugtn76y' }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      # Optional. Only needed while the panel is behind Cloudflare Access; unset is fine
      # if a Bypass policy covers /api/v1/deploy instead.
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Check Coolify secret
        id: check
        run: |
          if [ -z "${COOLIFY_API_TOKEN}" ]; then
            echo "::warning::COOLIFY_API_TOKEN repo secret not set — skipping CD step."
            echo "To enable gated deploys, create a token in Coolify → Keys & Tokens and add it as the COOLIFY_API_TOKEN repo secret."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Trigger Coolify deploy
        if: steps.check.outputs.skip == 'false'
        id: trigger
        run: |
          set -euo pipefail
          # The panel sits behind Cloudflare Access. Without credentials Access answers
          # the API call with a 302 to its login page, so the token never reaches
          # Coolify and the JSON parse below fails on HTML. Send an Access service
          # token when one is configured; create it in Cloudflare (Zero Trust → Access
          # → Service Auth) and add both halves as repo secrets. Alternatively add a
          # Bypass policy for /api/v1/deploy and leave these unset.
          access_headers=()
          if [ -n "${CF_ACCESS_CLIENT_ID}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET}" ]; then
            access_headers+=(--header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}")
            access_headers+=(--header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}")
            echo "Using a Cloudflare Access service token."
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --request GET \
            --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            --header "Accept: application/json" \
            "${access_headers[@]}" \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false")

          # Diagnose an interception before letting jq fail on HTML with a parse error
          # that says nothing about the actual cause.
          if ! printf '%s' "${response}" | jq -e . >/dev/null 2>&1; then
            echo "Coolify response (not JSON): ${response}"
            if printf '%s' "${response}" | grep -qi 'cloudflare\|cloudflareaccess\|302 Found'; then
              echo "::error::Cloudflare Access intercepted the Coolify API — the request never reached Coolify. Add CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET repo secrets (Zero Trust → Access → Service Auth), or add a Bypass policy for /api/v1/deploy."
            else
              echo "::error::Coolify returned a non-JSON response (see above)."
            fi
            exit 1
          fi

          echo "Coolify response: ${response}"
          deployment_uuid=$(printf '%s' "${response}" | jq -r '.deployments[0].deployment_uuid // .deployment_uuid // empty')
          if [ -z "${deployment_uuid}" ]; then
            echo "::error::Could not parse deployment_uuid from Coolify response."
            exit 1
          fi
          echo "deployment_uuid=${deployment_uuid}" >> "${GITHUB_OUTPUT}"
          echo "Started Coolify deployment ${deployment_uuid}"

      - name: Wait for deployment to finish
        if: steps.check.outputs.skip == 'false'
        env:
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          attempts=0
          max_attempts=90  # 90 * 10s = 15 min
          while : ; do
            http_status=$(curl --silent --output /tmp/dep.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --header "Accept: application/json" \
              "${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT_UUID}")
            if [ "${http_status}" = "403" ]; then
              echo "::warning::COOLIFY_API_TOKEN lacks 'read' permission — cannot poll deployment status."
              echo "Deploy ${DEPLOYMENT_UUID} was queued; check progress in the Coolify UI: ${COOLIFY_URL}"
              echo "To enable status polling, recreate the token with read+write scopes."
              exit 0
            fi
            if [ "${http_status}" != "200" ]; then
              echo "::error::Coolify status endpoint returned HTTP ${http_status}"
              cat /tmp/dep.json || true
              exit 1
            fi
            status=$(jq -r '.status // .data.status // "unknown"' < /tmp/dep.json)
            echo "Deployment ${DEPLOYMENT_UUID} status: ${status}"
            case "${status}" in
              finished|success|successful)
                echo "Deployment finished successfully."
                exit 0
                ;;
              failed|cancelled|cancelled-by-user|error)
                echo "::error::Coolify deployment ended with status '${status}'."
                jq . < /tmp/dep.json || true
                exit 1
                ;;
            esac
            attempts=$((attempts + 1))
            if [ "${attempts}" -ge "${max_attempts}" ]; then
              echo "::error::Timed out waiting for Coolify deployment to finish."
              exit 1
            fi
            sleep 10
          done
