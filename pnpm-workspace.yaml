packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  cpu-features: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: false
  ssh2: false

overrides:
  sharp: '^0.35.5' # GHSA-f88m-g3jw-g9cj, GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w via next (AIAGE-80)
  postcss: '^8.5.23' # next 15.5.29 pins 8.4.31: postcss, nanoid, source-map-js advisories (AIAGE-80)
  '@prisma/config>effect': '^3.22.5' # prisma 6.19.3 pins 3.21.0, ReDoS advisory (AIAGE-80)
  '@prisma/config>deepmerge-ts': '^8.0.2' # prisma 6.19.3 pins 7.1.5, GHSA-ggr8-5vv4-36mx; only used as c12's plain-object merger (AIAGE-80)
